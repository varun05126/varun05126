          keyTimes="0;0.1333;0.90;1"
          dur="12s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="clipL2">
      <rect x="30" y="70" width="0" height="34">
        <animate
          attributeName="width"
          values="0;0;600;600;0"
          keyTimes="0;0.1667;0.30;0.90;1"
          dur="12s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="clipL3">
      <rect x="30" y="115" width="0" height="34">
        <animate
          attributeName="width"
          values="0;0;700;700;0"
          keyTimes="0;0.3333;0.4667;0.90;1"
          dur="12s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="clipL4">
