      opacity="0.12"
    />

    <text
      x="145"
      y="213"
      text-anchor="middle"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="21"
      font-weight="700"
      fill="#ffffff"
    >
      H
    </text>

    <text
      x="190"
      y="202"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="15"
      font-weight="700"
      fill="#ffffff"
    >
      HackerRank
    </text>

    <text
      x="190"
      y="223"
      font-family="monospace"
      font-size="12"
      fill="#dcd9ff"
    >
      malthumkarvarun
    </text>
  </g>


  <!-- ================= LEETCODE ================= -->

  <g>
    <circle
      cx="465"
      cy="205"
      r="25"
      fill="#ffffff"
      opacity="0.12"
    />

    <text
      x="465"
      y="213"
      text-anchor="middle"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="20"
      font-weight="700"
      fill="#ffffff"
    >
      LC
    </text>

    <text
      x="510"
      y="202"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="15"
      font-weight="700"
      fill="#ffffff"
    >
      LeetCode
    </text>

    <text
      x="510"
      y="223"
      font-family="monospace"
      font-size="12"
      fill="#dcd9ff"
    >
      varun_5126
    </text>
  </g>


  <!-- ================= CODECHEF ================= -->

  <g>
    <circle
      cx="680"
      cy="170"
      r="25"
      fill="#ffffff"
      opacity="0.12"
    />

    <text
      x="680"
      y="178"
      text-anchor="middle"
      font-family="Segoe UI, Arial, sans-serif"
      font-size="20"
      font-weight="700"
      fill="#ffffff"
    >
      CC
    </text>

    <text
      x="720"
