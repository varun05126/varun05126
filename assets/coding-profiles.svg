      font-family="monospace"
      font-size="12"
      fill="#dcd9ff"
    >
      varun_05126
    </text>
  </g>


  <!-- ================= FOOTNOTE ================= -->

  <text
    x="450"
    y="255"
    font-family="Segoe UI, Helvetica, Arial, sans-serif"
    font-size="12"
    fill="#ffffff"
    text-anchor="middle"
    opacity="0.70"
    letter-spacing="1"
  >
    CODE • SOLVE • LEARN • IMPROVE
  </text>

</svg>
