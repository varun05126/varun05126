  </text>


  <!-- ================================================= -->
  <!--                     FOOT NOTE                    -->
  <!-- ================================================= -->

  <text
    x="450"
    y="325"
    font-family="Segoe UI, Helvetica, Arial, sans-serif"
    font-size="13"
    fill="#ffffff"
    text-anchor="middle"
    opacity="0.75"
    letter-spacing="1"
  >
    BUILD • LEARN • EXPLORE • CREATE
  </text>


</svg>
