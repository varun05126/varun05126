<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a11cb"/>
      <stop offset="50%" stop-color="#4757e6"/>
      <stop offset="100%" stop-color="#2575fc"/>
    </linearGradient>
    <linearGradient id="panelStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="bokehBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>

  <circle cx="110" cy="55" r="95" fill="#ffffff" opacity="0.18" filter="url(#bokehBlur)"/>
  <circle cx="800" cy="60" r="110" fill="#a78bfa" opacity="0.22" filter="url(#bokehBlur)"/>
  <circle cx="760" cy="220" r="130" fill="#ffffff" opacity="0.14" filter="url(#bokehBlur)"/>
  <circle cx="90" cy="215" r="80" fill="#22d3ee" opacity="0.16" filter="url(#bokehBlur)"/>

  <rect x="65" y="52" width="770" height="30" rx="24" fill="#ffffff" opacity="0.10" filter="url(#glassBlur)"/>

  <rect x="60" y="48" width="780" height="164" rx="26" fill="#ffffff" opacity="0.10"/>
  <rect x="60" y="48" width="780" height="164" rx="26" fill="none" stroke="url(#panelStroke)" stroke-width="1.5"/>

  <line x1="90" y1="70" x2="500" y2="70" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>

  <text x="450" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    Hi There, I'm Varun 👋
  </text>
  <text x="450" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e9e7ff" text-anchor="middle" letter-spacing="1">
    Student  •  Tech Enthusiast
  </text>
  <text x="450" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c9c4f5" text-anchor="middle" letter-spacing="2" opacity="0.85">
    PYTHON · C · JAVA · WEB DEVELOPMENT · DSA
  </text>
</svg>
