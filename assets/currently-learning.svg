<svg
  width="900"
  height="400"
  viewBox="0 0 900 400"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6a11cb"/>
      <stop offset="50%" stop-color="#4757e6"/>
      <stop offset="100%" stop-color="#2575fc"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65">
        <animate
          attributeName="stop-opacity"
          values="0.65;0.25;0.65"
          dur="4s"
          repeatCount="indefinite"
        />
      </stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="bokehBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="panelClip">
      <rect x="40" y="20" width="820" height="360" rx="24"/>
    </clipPath>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect width="900" height="400" fill="url(#bg)"/>

  <!-- ================= BOKEH ================= -->
  <circle cx="90" cy="60" r="110" fill="#ffffff" opacity="0.14" filter="url(#bokehBlur)">
    <animate attributeName="cx" values="90;140;90" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;30;60" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="340" r="130" fill="#a78bfa" opacity="0.18" filter="url(#bokehBlur)">
    <animate attributeName="cx" values="820;770;820" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="340;370;340" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- ================= GLASS PANEL ================= -->
  <rect x="40" y="20" width="820" height="360" rx="24" fill="#ffffff" opacity="0.10"/>
  <rect x="40" y="20" width="820" height="360" rx="24" fill="none" stroke="url(#stroke)" stroke-width="1.5"/>

  <!-- ================= SHIMMER ================= -->
  <g clip-path="url(#panelClip)">
    <rect x="-250" y="20" width="180" height="360" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-250;900" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ================= TITLE ================= -->
  <text x="450" y="65" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="700" fill="#ffffff" letter-spacing="1">
    🌱 CURRENTLY LEARNING
  </text>
  <line x1="80" y1="90" x2="820" y2="90" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>

  <!-- ================= COLUMN HEADERS ================= -->
  <text x="80" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14"
        font-weight="700" fill="#ffffff" opacity="0.75" letter-spacing="1">🚀 AREA</text>
  <text x="420" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14"
        font-weight="700" fill="#ffffff" opacity="0.75" letter-spacing="1">📚 FOCUS</text>
  <line x1="80" y1="137" x2="820" y2="137" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>

  <!-- ================= ROWS ================= -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="173" font-size="17" font-weight="600" fill="#ffffff">🐍 Python</text>
    <text x="420" y="173" font-size="16" fill="#e7e9ff" opacity="0.92">Advanced Python &amp; Automation</text>
    <line x1="80" y1="192" x2="820" y2="192" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

    <text x="80" y="228" font-size="17" font-weight="600" fill="#ffffff">🌐 Full-Stack</text>
    <text x="420" y="228" font-size="16" fill="#e7e9ff" opacity="0.92">Frontend + Backend Development</text>
    <line x1="80" y1="247" x2="820" y2="247" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

    <text x="80" y="283" font-size="17" font-weight="600" fill="#ffffff">🤖 AI</text>
    <text x="420" y="283" font-size="16" fill="#e7e9ff" opacity="0.92">Artificial Intelligence &amp; Machine Learning</text>
    <line x1="80" y1="302" x2="820" y2="302" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

    <text x="80" y="338" font-size="17" font-weight="600" fill="#ffffff">🧠 DSA</text>
    <text x="420" y="338" font-size="16" fill="#e7e9ff" opacity="0.92">Data Structures &amp; Algorithms</text>
    <line x1="80" y1="357" x2="820" y2="357" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

    <text x="80" y="376" font-size="17" font-weight="600" fill="#ffffff">💻 Software Engineering</text>
    <text x="420" y="376" font-size="16" fill="#e7e9ff" opacity="0.92">Clean &amp; Scalable Code</text>
  </g>
</svg>
